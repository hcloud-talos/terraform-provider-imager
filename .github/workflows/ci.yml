name: CI

on:
  push:
    branches: ["main", "next"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Install tools
        run: mise install

      - name: Lint + test
        run: mise run check

      - name: Docs up-to-date
        run: mise run docs:check
