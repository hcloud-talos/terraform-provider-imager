name: CI

on:
  push:
    branches: ["main", "next"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Install tools
        run: mise install

      - name: Lint + test
        run: mise run check

      - name: Docs up-to-date
        run: mise run docs:check
