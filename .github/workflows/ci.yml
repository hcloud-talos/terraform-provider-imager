name: CI

on:
  push:
    branches: ["main", "next"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3

      - name: Install tools
        run: mise install

      - name: Lint + test
        run: mise run check

      - name: Docs up-to-date
        run: mise run docs:check
