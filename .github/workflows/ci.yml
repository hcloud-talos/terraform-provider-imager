name: CI

on:
  push:
    branches: ["main", "next"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Install tools
        run: mise install

      - name: Lint + test
        run: mise run check

      - name: Docs up-to-date
        run: mise run docs:check
